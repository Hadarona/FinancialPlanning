services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the setup script first}
    volumes:
      - budget-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U budget -d budget]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://budget:${POSTGRES_PASSWORD}@db:5432/budget?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Run the setup script first}
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - budget-logs:/app/logs
volumes:
  budget-data:
  budget-logs:
